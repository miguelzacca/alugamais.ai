<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inquilinos — AlugaMais</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/global.css">
    <style>
        .tenant-card {
            display: grid; grid-template-columns: auto 1fr auto auto;
            gap: 1.2rem; align-items: center;
            padding: 1.1rem 1.5rem; border-bottom: 1px solid var(--glass-border);
            transition: background var(--transition-speed); cursor: pointer;
            text-decoration: none; color: inherit;
        }
        .tenant-card:last-child { border-bottom: none; }
        .tenant-card:hover { background: var(--glass-bg); }
        .tenant-avatar {
            width: 42px; height: 42px; border-radius: 50%;
            background: linear-gradient(135deg, hsl(var(--primary-color)), hsl(var(--accent)));
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 1rem; color: white; flex-shrink: 0;
        }
        .tenant-info h4 { font-size: 0.95rem; font-weight: 600; margin-bottom: 0.2rem; }
        .tenant-info p { font-size: 0.82rem; color: hsl(var(--text-secondary)); }
        .tenant-amount { font-weight: 700; font-size: 1rem; text-align: right; }
        .tenant-amount small { display: block; font-size: 0.75rem; color: hsl(var(--text-secondary)); font-weight: 400; }

        .search-bar { position: relative; }
        .search-bar input { padding-left: 2.5rem; }
        .search-icon { position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%); color: hsl(var(--text-secondary)); font-size: 0.9rem; pointer-events: none; }
        .filters { display: flex; gap: 0.75rem; flex-wrap: wrap; }
        .filter-btn { padding: 0.35rem 1rem; border-radius: 999px; background: var(--glass-bg); border: 1px solid var(--glass-border); color: hsl(var(--text-secondary)); font-size: 0.8rem; font-weight: 500; cursor: pointer; transition: all var(--transition-speed); }
        .filter-btn.active { background: hsla(var(--primary-color)/0.15); border-color: hsla(var(--primary-color)/0.4); color: hsl(var(--primary-color)); }
    </style>
</head>
<body>
<div class="app-layout">
    <aside class="sidebar">
        <div class="sidebar-logo"><div class="sidebar-logo-mark">A+</div>AlugaMais</div>
        <span class="sidebar-section-label">Menu</span>
        <nav>
            <a href="/dashboard.html" class="nav-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Painel</a>
            <a href="/properties.html" class="nav-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Imóveis</a>
            <a href="/owners.html" class="nav-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Proprietários</a>
            <a href="/tenants.html" class="nav-link active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>Inquilinos</a>
            <a href="/charges.html" class="nav-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>Cobranças</a>
            <a href="/payments.html" class="nav-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>Pagamentos</a>
            <a href="/reports.html" class="nav-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>Relatórios</a>
        </nav>
        <div class="sidebar-footer"><button class="logout-btn" onclick="logout()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Sair</button></div>
    </aside>

    <main class="main-content">
        <div class="page-header">
            <div>
                <h1 class="page-title">Inquilinos</h1>
                <p class="page-subtitle">Gerencie todos os seus contratos de aluguel</p>
            </div>
            <a href="/new-rental.html" class="btn btn-primary">+ Novo Aluguel</a>
        </div>

        <!-- Search & Filter -->
        <div style="display:flex;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap">
            <div class="search-bar" style="flex:1;min-width:220px">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" class="form-control" placeholder="Buscar por nome, endereço ou CPF...">
            </div>
            <div class="filters">
                <button class="filter-btn active" onclick="setFilter('all',this)">Todos</button>
                <button class="filter-btn" onclick="setFilter('active',this)">Ativos</button>
                <button class="filter-btn" onclick="setFilter('ended',this)">Encerrados</button>
            </div>
        </div>

        <!-- Stats row -->
        <div class="stats-grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:1.5rem">
            <div class="stat-card glass-panel">
                <div class="stat-label">Total</div>
                <div class="stat-value" id="s-total">—</div>
            </div>
            <div class="stat-card glass-panel">
                <div class="stat-label">Ativos</div>
                <div class="stat-value text-success" id="s-active">—</div>
            </div>
            <div class="stat-card glass-panel">
                <div class="stat-label">Encerrados</div>
                <div class="stat-value text-muted" id="s-ended">—</div>
            </div>
            <div class="stat-card glass-panel">
                <div class="stat-label">Receita Total</div>
                <div class="stat-value" id="s-revenue">—</div>
            </div>
        </div>

        <div class="glass-panel" style="overflow:hidden" id="tenants-list">
            <div style="text-align:center;padding:3rem;color:hsl(var(--text-secondary))">Carregando...</div>
        </div>
    </main>
</div>

<script type="module">
    const token = localStorage.getItem('alugamais_token');
    if (!token) window.location.href = '/login.html';
    window.logout = () => { localStorage.removeItem('alugamais_token'); window.location.href='/login.html'; };

    const BRL = new Intl.NumberFormat('pt-BR', { style:'currency', currency:'BRL' });
    let allRentals = [];
    let currentFilter = 'all';
    let searchQuery = '';

    const typeIcon = { apartment:'🏢', house:'🏡', commercial:'🏪', land:'🌿' };
    const statusBadge = s => {
        const m = { active:'badge-success', ended:'badge-secondary' };
        const l = { active:'Ativo', ended:'Encerrado' };
        return `<span class="badge ${m[s]||'badge-secondary'}">${l[s]||s}</span>`;
    };

    function initials(name) {
        return name.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
    }

    function render() {
        let list = allRentals;
        if (currentFilter !== 'all') list = list.filter(r => r.status === currentFilter);
        if (searchQuery) {
            const q = searchQuery.toLowerCase();
            list = list.filter(r =>
                r.tenantName.toLowerCase().includes(q) ||
                (r.property?.address||'').toLowerCase().includes(q) ||
                (r.tenantDocument||'').toLowerCase().includes(q)
            );
        }

        document.getElementById('s-total').textContent = allRentals.length;
        document.getElementById('s-active').textContent = allRentals.filter(r=>r.status==='active').length;
        document.getElementById('s-ended').textContent = allRentals.filter(r=>r.status==='ended').length;
        document.getElementById('s-revenue').textContent = BRL.format(allRentals.filter(r=>r.status==='active').reduce((s,r)=>s+r.baseRentAmount,0));

        const el = document.getElementById('tenants-list');
        if (list.length === 0) {
            el.innerHTML = `<div class="empty-state"><div class="empty-state-icon">👥</div><h3>Nenhum inquilino encontrado</h3><p>Tente outro filtro ou <a href="/new-rental.html">cadastre um novo aluguel</a></p></div>`;
            return;
        }
        el.innerHTML = list.map(r => `
            <a href="/rental-detail.html?id=${r.id}" class="tenant-card">
                <div class="tenant-avatar">${initials(r.tenantName)}</div>
                <div class="tenant-info">
                    <h4>${r.tenantName}</h4>
                    <p>${typeIcon[r.property?.propertyType]||'🏠'} ${r.property?.address||'—'}${r.property?.buildingName ? ` · ${r.property.buildingName}` : ''}</p>
                    ${r.tenantEmail ? `<p style="margin-top:0.15rem">✉️ ${r.tenantEmail}</p>` : ''}
                </div>
                <div>${statusBadge(r.status)}</div>
                <div class="tenant-amount">
                    ${BRL.format(r.baseRentAmount)}
                    <small>Vence dia ${r.dueDateDay}</small>
                </div>
            </a>
        `).join('');
    }

    window.setFilter = function(f, btn) {
        currentFilter = f;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
    };

    document.getElementById('searchInput').addEventListener('input', e => {
        searchQuery = e.target.value;
        render();
    });

    async function load() {
        try {
            const res = await fetch('/api/rentals', { headers:{ 'Authorization':`Bearer ${token}` } });
            if (res.status === 401) return window.logout();
            allRentals = await res.json();
            render();
        } catch(e) {
            document.getElementById('tenants-list').innerHTML = '<div class="empty-state"><p>⚠️ Erro ao carregar inquilinos.</p></div>';
        }
    }
    load();
</script>
</body>
</html>
