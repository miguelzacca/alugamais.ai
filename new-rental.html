<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Aluguel - AlugaMais</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/global.css">
    <style>
        .page-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 3rem 1rem;
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 2rem;
            gap: 1rem;
        }

        .form-section {
            padding: 2rem;
            margin-bottom: 1.5rem;
        }

        h2 {
            margin-bottom: 1.5rem;
            font-size: 1.2rem;
            color: hsl(var(--primary-color));
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: hsl(var(--text-secondary));
        }

        .form-control {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--glass-border);
            background-color: rgba(0,0,0,0.2);
            color: hsl(var(--text-primary));
            font-family: inherit;
        }
        
        .form-control:focus {
            outline: none;
            border-color: hsl(var(--primary-color));
        }

        .fees-container {
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            padding: 1rem;
            margin-top: 1rem;
        }

        .fee-row {
            display: flex;
            gap: 1rem;
            margin-bottom: 0.5rem;
            align-items: center;
        }

        .fee-row input {
            flex: 1;
        }

        .remove-fee {
            background: none;
            border: none;
            color: hsl(var(--danger));
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0 0.5rem;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 2rem;
        }
        
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: hsl(var(--success));
            color: white;
            padding: 1rem 2rem;
            border-radius: var(--radius-md);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
        }
        
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="header">
            <a href="/dashboard.html" class="btn btn-glass">← Voltar</a>
            <h1>Cadastrar Novo Aluguel</h1>
        </div>

        <form id="rentalForm">
            <!-- Imóvel -->
            <div class="glass-panel form-section">
                <h2>1. Dados do Imóvel</h2>
                <div class="form-group">
                    <label>Endereço Completo</label>
                    <input type="text" id="address" class="form-control" required placeholder="Ex: Rua das Flores, 123 - Apto 402">
                </div>
                <div class="form-group">
                    <label>Nome do Edifício / Condomínio (Opcional)</label>
                    <input type="text" id="buildingName" class="form-control" placeholder="Ex: Edifício Sol Nascente">
                </div>
            </div>

            <!-- Inquilino -->
            <div class="glass-panel form-section">
                <h2>2. Inquilino e Contrato</h2>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Nome do Inquilino</label>
                        <input type="text" id="tenantName" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>CPF/CNPJ (Opcional)</label>
                        <input type="text" id="tenantDocument" class="form-control">
                    </div>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Data de Entrada</label>
                        <input type="date" id="moveInDate" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Dia do Vencimento</label>
                        <input type="number" id="dueDateDay" class="form-control" min="1" max="31" required placeholder="Ex: 5">
                    </div>
                </div>
            </div>

            <!-- Valores e Taxas -->
            <div class="glass-panel form-section">
                <h2>3. Valores e Taxas</h2>
                <div class="form-group">
                    <label>Valor Base do Aluguel (R$)</label>
                    <input type="number" step="0.01" id="baseRent" class="form-control" required placeholder="1500.00">
                </div>

                <div class="fees-container">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 1rem;">
                        <h3>Taxas Adicionais (Condomínio, IPTU, etc)</h3>
                        <button type="button" class="btn btn-glass" onclick="addFeeRow()">+ Adicionar Taxa</button>
                    </div>
                    <div id="feesList">
                        <!-- Fee rows inserted here -->
                    </div>
                </div>
            </div>

            <div class="actions">
                <a href="/dashboard.html" class="btn btn-glass">Cancelar</a>
                <button type="submit" class="btn btn-primary" id="submitBtn">Salvar Aluguel</button>
            </div>
        </form>
    </div>
    
    <div id="toast" class="toast">Aluguel cadastrado com sucesso!</div>

    <script type="module">
        const token = localStorage.getItem('alugamais_token');
        if (!token) window.location.href = '/login.html';

        window.fees = [];

        window.addFeeRow = function() {
            const id = Date.now();
            window.fees.push({ id, type: '', amount: '' });
            renderFees();
        }

        window.removeFee = function(id) {
            window.fees = window.fees.filter(f => f.id !== id);
            renderFees();
        }

        window.updateFee = function(id, field, value) {
            const fee = window.fees.find(f => f.id === id);
            if(fee) fee[field] = value;
        }

        function renderFees() {
            const container = document.getElementById('feesList');
            if (window.fees.length === 0) {
                container.innerHTML = '<p style="color: gray; font-size: 0.9rem;">Nenhuma taxa adicional.</p>';
                return;
            }

            container.innerHTML = window.fees.map(f => `
                <div class="fee-row">
                    <input type="text" class="form-control" placeholder="Nome (Ex: Condomínio)" 
                           value="${f.type}" onchange="updateFee(${f.id}, 'type', this.value)" required>
                    <input type="number" step="0.01" class="form-control" placeholder="Valor (R$)" 
                           value="${f.amount}" onchange="updateFee(${f.id}, 'amount', this.value)" required>
                    <button type="button" class="remove-fee" onclick="removeFee(${f.id})">×</button>
                </div>
            `).join('');
        }

        renderFees();

        document.getElementById('rentalForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Salvando...';

            const payload = {
                address: document.getElementById('address').value,
                buildingName: document.getElementById('buildingName').value,
                tenantName: document.getElementById('tenantName').value,
                tenantDocument: document.getElementById('tenantDocument').value,
                baseRentAmount: document.getElementById('baseRent').value,
                moveInDate: document.getElementById('moveInDate').value,
                dueDateDay: document.getElementById('dueDateDay').value,
                fees: window.fees.map(f => ({ feeType: f.type, amount: f.amount, isVariable: false }))
            };

            try {
                const res = await fetch('/api/rentals', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) throw new Error('Falha ao salvar');

                // Show toast
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                
                setTimeout(() => {
                    window.location.href = '/dashboard.html';
                }, 1500);

            } catch (err) {
                alert('Erro ao salvar o aluguel.');
                btn.disabled = false;
                btn.textContent = 'Salvar Aluguel';
            }
        });
    </script>
</body>
</html>
